<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDNLDR - Video Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .container-main {
            max-width: 800px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }
        .header h1 {
            margin: 0;
            font-weight: 700;
            color: #333;
        }
        .header p {
            margin: 0 0 0 15px;
            color: #666;
            font-size: 0.9rem;
        }
        .segment-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            margin: 20px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            min-height: 50px;
            max-height: 150px;
            overflow-y: auto;
        }
        .segment {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .segment.pending {
            background: #ccc;
        }
        .segment.downloading {
            background: #ffc107;
            animation: pulse 1s infinite;
        }
        .segment.done {
            background: #28a745;
        }
        .segment.failed {
            background: #dc3545;
            cursor: pointer;
        }
        .segment.failed:hover {
            opacity: 0.8;
            transform: scale(1.2);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .downloads-list {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .download-item {
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 3px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .download-item .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        #statusCounter {
            font-weight: bold;
            color: #667eea;
        }
        .input-group-compact {
            gap: 5px;
        }
    </style>
</head>
<body>
    <div class="container-main">
        <div class="header">
            <div>
                <h1>VDNLDR</h1>
                <p>Online video downloader</p>
            </div>
        </div>
        
        <!-- URL Input -->
        <div class="mb-3">
            <label for="urlInput" class="form-label">M3U8 URL</label>
            <input type="text" class="form-control" id="urlInput" placeholder="https://example.com/stream.m3u8">
        </div>
        
        <!-- Analyse Button -->
        <div class="mb-3">
            <div class="d-flex gap-2">
                <button class="btn btn-primary" id="analyseBtn">Analyse</button>
                <button class="btn btn-outline-secondary" id="pasteUrlBtn">Paste URL</button>
            </div>
        </div>
        
        <!-- Resolution Dropdown -->
        <div class="mb-3" id="resolutionDiv" style="display:none;">
            <label for="resolutionDropdown" class="form-label">Resolution</label>
            <select class="form-select" id="resolutionDropdown">
                <option value="">Select a resolution</option>
            </select>
        </div>
        
        <!-- Workers Input + Start Button -->
        <div class="mb-3" id="workersDiv" style="display:none;">
            <label class="form-label">Download Workers</label>
            <div class="d-flex gap-2">
                <input type="number" class="form-control" id="workersInput" value="5" min="1" max="20" style="max-width: 80px;">
                <button class="btn btn-success" id="startBtn">Start Download</button>
            </div>
            <small class="text-muted">More workers = faster download (1-20)</small>
        </div>
        
        <!-- Segment Display -->
        <div id="segmentDiv" style="display:none;">
            <label>Progress (<span id="statusCounter">0</span> / <span id="totalCounter">0</span> downloaded)</label>
            <div class="segment-container" id="segmentContainer"></div>
            <small class="text-muted">🟩 Done | 🟨 Downloading | 🔴 Failed (click to retry) | ⬜ Pending</small>
        </div>
        
        <!-- Convert + Download Full -->
        <div class="mb-3" id="actionDiv" style="display:none;">
            <div class="d-grid gap-2">
                <div class="d-flex gap-2">
                    <button class="btn btn-warning" id="pauseBtn">Pause Download</button>
                    <button class="btn btn-secondary" id="resumeBtn" style="display:none;">Resume Download</button>
                </div>
                <button class="btn btn-info" id="convertBtn">Convert & Download</button>
                <button class="btn btn-success btn-lg" id="downloadFullBtn" style="display:none;">⬇ Download Full Video</button>
                <button class="btn btn-danger" id="deleteAllBtn">Delete All Downloads</button>
            </div>
        </div>
        
        <!-- Recent Downloads -->
        <div class="downloads-list" id="downloadsDiv" style="display:none;">
            <h5>📥 Recent Downloads</h5>
            <div id="downloadsList"></div>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='application/app.js') }}"></script>
</body>
</html>
